name: Reviews Sync (manual test run)

# Manual trigger only. Use this to confirm reviews_sync.py works end to end
# (BD endpoint guess, GitHub write) before setting up the real Render cron.
# Go to the Actions tab, pick this workflow, click "Run workflow".
on:
  workflow_dispatch:

jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reviews sync
        env:
          BD_API_KEY: ${{ secrets.BD_API_KEY }}
          # Not used by reviews, but listing_stats_sync.py requires it at
          # import time, so the script won't start without it.
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_LWEA_SEARCH }}
          GITHUB_REPO: mindthegaptutoring/lwea-search
        run: python reviews_sync.py
